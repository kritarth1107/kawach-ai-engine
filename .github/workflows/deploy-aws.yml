name: Deploy AI engine to AWS

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      override_nightly:
        description: "The founder only: deploy even though the latest nightly failed (trust plan D8)"
        default: "false"

concurrency:
  group: deploy-engine-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR: 743887469650.dkr.ecr.ap-south-1.amazonaws.com/kawach-ai-engine
  FAMILY: kavach-engine
  SERVICE: engine

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.17.0 pyright==1.1.414
      - run: ruff check app eval tests
      - run: python scripts/pyright_gate.py

  nightly-gate:
    # A red Bedrock night blocks the deploy. A night that never reached the model exits 0 (unavailable), so it does not.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Latest nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          OVERRIDE_NIGHTLY: ${{ github.event.inputs.override_nightly }}
        run: python3 scripts/nightly_gate.py

  replay:
    needs: [test, lint]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/replay.yml
    secrets: inherit

  deploy:
    needs: [test, lint, nightly-gate, replay]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kawach-ai-engine
          aws-region: ap-south-1
      - name: Build and push
        env:
          IMAGE: ${{ env.ECR }}:${{ github.sha }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR%/*}"
          docker build -t app:build .
          curl -fsS -o /tmp/rds-ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          user=$(docker inspect -f '{{.Config.User}}' app:build)
          user=${user:-root}
          mkdir -p /tmp/ca-wrap && cp /tmp/rds-ca.pem /tmp/ca-wrap/rds-ca.pem
          printf 'FROM app:build\nUSER root\nCOPY --chmod=644 rds-ca.pem /etc/ssl/certs/rds-global-bundle.pem\nUSER %s\n' "$user" > /tmp/ca-wrap/Dockerfile
          docker build -t "$IMAGE" /tmp/ca-wrap
          docker push "$IMAGE"
      - name: Roll the live service (image only)
        env:
          IMAGE: ${{ env.ECR }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition \
            | jq --arg IMG "$IMAGE" --arg NAME "kawach-ai-engine" '
                def setenv($n; $v):
                  .environment = ((.environment // [])
                    | map(if .name == $n then .value = $v else . end)
                    | if any(.[]; .name == $n) then . else . + [{name:$n, value:$v}] end);
                .containerDefinitions |= map(
                  if ((.image | split("/") | last | split(":")[0]) == $NAME) then
                    .image = $IMG
                    # A one-shot EMBED_DIM_MIGRATE=on must not survive the next image roll.
                    # 15 Oct 02:33 copied the temporary :17 flag onto :18.
                    # GEMINI_SG_FALLBACK=on is the founder yes (15 Oct): one Singapore call after a Mumbai 429 or timeout.
                    | setenv("EMBED_DIM_MIGRATE"; "off")
                    | setenv("GEMINI_SG_FALLBACK"; "on")
                    # 16 Oct guest bench: Apollo and Rapido stay on v2; 1mg uses v4 Gemini. Browse thinks high, matching the winning runs.
                    | setenv("BROWSER_API_APOLLO"; "v2")
                    | setenv("BROWSER_API_RAPIDO"; "v2")
                    | setenv("BROWSER_API_1MG"; "v4")
                    | setenv("BROWSER_MODEL_1MG"; "gemini-3.5-flash")
                    | setenv("BROWSER_THINKING_APOLLO"; "browse:high")
                    | setenv("BROWSER_THINKING_RAPIDO"; "browse:high")
                    | setenv("BROWSER_THINKING_1MG"; "browse:high")
                  else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > /tmp/td.json
          REV=$(aws ecs register-task-definition --cli-input-json file:///tmp/td.json --query taskDefinition.revision --output text)
          aws ecs update-service --cluster kavach --service "$SERVICE" --task-definition "$FAMILY:$REV" >/dev/null
          # Dream runs this same image and env. A stored kavach-dream revision otherwise stays on
          # whatever the last hand edit was (15 Oct 02:00 ran a 12-hour-old task and emptied the
          # vector columns). The job must not migrate those columns; the server does that.
          jq '.family = "kavach-dream"
            | .containerDefinitions |= map(
                if .name == "engine" then
                  .command = ["python", "-m", "app.jobs.dream", "--all"]
                  | .environment = ((.environment // [])
                      | map(if .name == "EMBED_DIM_MIGRATE" then .value = "off"
                           elif .name == "GEMINI_SG_FALLBACK" then .value = "on" else . end)
                      | if any(.[]; .name == "EMBED_DIM_MIGRATE") then . else . + [{"name":"EMBED_DIM_MIGRATE","value":"off"}] end
                      | if any(.[]; .name == "GEMINI_SG_FALLBACK") then . else . + [{"name":"GEMINI_SG_FALLBACK","value":"on"}] end)
                else . end)' /tmp/td.json > /tmp/dream.json
          aws ecs register-task-definition --cli-input-json file:///tmp/dream.json --query taskDefinition.revision --output text
          # The draft gate. GitHub cannot reach the engine. This task can: Gemini in kavach-eval-1015, ₹30,
          # a throwaway database beside it. The live service stays on kavach-care.
          jq '.family = "kavach-learn-gate"
            | .cpu = "1024"
            | .memory = "4096"
            | .containerDefinitions |= (
                map(if .name == "engine" then
                  .command = ["python", "-m", "app.jobs.learn_gate"]
                  | .logConfiguration.options["awslogs-stream-prefix"] = "learn-gate"
                  | .environment = ((.environment // [])
                      | map(if .name == "GCP_PROJECT_ID" or .name == "GOOGLE_CLOUD_PROJECT" then .value = "kavach-eval-1015"
                           elif .name == "GOOGLE_CLOUD_LOCATION" then .value = "asia-south1"
                           elif .name == "LEARN_REPLAY_MAX_INR" then .value = "30"
                           elif .name == "REPLAY_DATABASE_URL" then .value = "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kawach_replay"
                           elif .name == "WEB_SEARCH_PROVIDER" then .value = "off"
                           elif .name == "MEMORY_EMBEDDINGS" then .value = "off"
                           elif .name == "EMBED_DIM_MIGRATE" then .value = "off"
                           else . end)
                      | if any(.[]; .name == "GCP_PROJECT_ID") then . else . + [{"name":"GCP_PROJECT_ID","value":"kavach-eval-1015"}] end
                      | if any(.[]; .name == "GOOGLE_CLOUD_PROJECT") then . else . + [{"name":"GOOGLE_CLOUD_PROJECT","value":"kavach-eval-1015"}] end
                      | if any(.[]; .name == "GOOGLE_CLOUD_LOCATION") then . else . + [{"name":"GOOGLE_CLOUD_LOCATION","value":"asia-south1"}] end
                      | if any(.[]; .name == "LEARN_REPLAY_MAX_INR") then . else . + [{"name":"LEARN_REPLAY_MAX_INR","value":"30"}] end
                      | if any(.[]; .name == "REPLAY_DATABASE_URL") then . else . + [{"name":"REPLAY_DATABASE_URL","value":"postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kawach_replay"}] end
                      | if any(.[]; .name == "WEB_SEARCH_PROVIDER") then . else . + [{"name":"WEB_SEARCH_PROVIDER","value":"off"}] end
                      | if any(.[]; .name == "MEMORY_EMBEDDINGS") then . else . + [{"name":"MEMORY_EMBEDDINGS","value":"off"}] end
                      | if any(.[]; .name == "EMBED_DIM_MIGRATE") then . else . + [{"name":"EMBED_DIM_MIGRATE","value":"off"}] end)
                else . end)
                + [{name:"replay-db", image:"pgvector/pgvector:pg16", essential:false,
                    environment:[{name:"POSTGRES_USER",value:"postgres"},{name:"POSTGRES_PASSWORD",value:"postgres"},{name:"POSTGRES_DB",value:"kawach_replay"}],
                    portMappings:[{containerPort:5432,protocol:"tcp"}]}])' /tmp/td.json > /tmp/learn-gate.json
          aws ecs register-task-definition --cli-input-json file:///tmp/learn-gate.json --query taskDefinition.revision --output text
          aws ecs wait services-stable --cluster kavach --service "$SERVICE"
