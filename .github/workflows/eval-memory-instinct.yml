name: Eval memory instinct

on:
  pull_request:
    paths:
      - "app/rag/**"
      - "app/models/entities.py"
      - "app/api/memory.py"
      - "eval/memory_instinct_rubric.py"
  workflow_dispatch:

jobs:
  rubric:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_ai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/kawach_ai_test
      KAWACH_API_SECRET: test-secret
      LLM_PROVIDER: vertex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Instinct rubric
        run: python -m eval.memory_instinct_rubric
