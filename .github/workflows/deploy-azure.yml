name: Deploy AI engine to Azure

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_NAME: kavachprodacr
  IMAGE_NAME: kawach-ai-engine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy note
        run: |
          echo "Image pushed to ACR. Azure task 'kawach-ai-engine-redeploy' updates the Container App when :latest changes."
