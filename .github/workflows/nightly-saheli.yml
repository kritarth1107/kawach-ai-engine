name: Nightly Saheli (real AI on the synthetic world)
run-name: "Nightly ${{ github.event.inputs.repost_run && format('repost {0}', github.event.inputs.repost_run) || (github.event_name == 'schedule' && 'full' || inputs.slice) }}${{ inputs.fixture == 'true' && ' fixture' || '' }}"

# Plan B3: every night at 01:00 IST the real brain answers the probes of the synthetic families (30 languages, every
# household type), and a simulated week of every proactive job is checked against the message rules. Paid model calls
# go to Gemini 3.5 Flash in kavach-eval-1015. Never kavach-care. Sensitive probes stay paused. The world is synthetic.
#
# Trust plan C2: the scheduled night runs the FULL world (1,000 families): about one probe per family each night, rotating
# so all ~12,000 run within 11 nights, plus every crisis probe; every reply judged by the live judge; the story families'
# memory quiz scored (recall). The report writes scores.json and FAILS the night (exit 1) when a release bar breaks
# (eval/world/report.py). A provider-wide refusal is UNAVAILABLE (exit 0): deploys go on if the tests passed, and the team
# is emailed. Engine deploys on AWS wait while the latest full night failed (scripts/nightly_gate.py, deploy-aws.yml).
# Budget (the founder: not a concern): about ₹1,500-2,500 a night; the caps below are runaway guards above that.
# Scheduled workflows run only from the default branch (master).

on:
  schedule:
    - cron: "30 19 * * *"   # 01:00 IST
  workflow_dispatch:
    inputs:
      slice:
        description: "World slice: ci (120 families), nudge (200), full (1,000), or family ids"
        default: "full"
      every:
        description: "Run each family's probes every N nights (night = tonight's rotation; 1 = every probe of the slice)"
        default: "night"
      max_inr:
        description: "Spend guard for the night's probes, all shards together (Rs)"
        default: "3200"
      judge_inr:
        description: "Spend guard for the night's judge, all shards together (Rs)"
        default: "3200"
      recall_inr:
        description: "Spend guard for the story families' recall (Rs)"
        default: "700"
      nudge_inr:
        description: "Spend guard for the regular-nudge quality eval (Rs)"
        default: "400"
      fixture:
        description: "true: skip the run; put a stored failing scores.json through the gate (shows a failing night on purpose)"
        default: "false"
      repost_run:
        description: "A run id: post that night's scores.json to the engine again (its post was lost); nothing else runs"
        default: ""

concurrency:
  group: nightly-saheli
  cancel-in-progress: false

env:
  SLICE: ${{ github.event.inputs.slice || 'full' }}
  EVERY: ${{ github.event.inputs.every || 'night' }}
  MAX_INR: ${{ github.event.inputs.max_inr || '3200' }}
  JUDGE_INR: ${{ github.event.inputs.judge_inr || '3200' }}
  RECALL_INR: ${{ github.event.inputs.recall_inr || '700' }}
  NUDGE_INR: ${{ github.event.inputs.nudge_inr || '400' }}
  FIXTURE: ${{ github.event.inputs.fixture || 'false' }}
  SHARDS: "4"
  # Crisis, self-harm and illegal-substance test content (eval/sensitive.py): paused since Google started rejecting every
  # call in sunny-ship (14 Oct, 403 terms of use); "sample" once the founder has answered Google: CRISIS_SAMPLE crisis
  # probes a night, the founder's drug cases only here (never before a deploy).
  SENSITIVE_EVALS: pause
  CRISIS_SAMPLE: "30"
  GCP_PROJECT_ID: kavach-eval-1015
  GOOGLE_CLOUD_PROJECT: kavach-eval-1015
  GOOGLE_CLOUD_LOCATION: asia-south1

jobs:
  probes:
    if: github.event.inputs.fixture != 'true' && !github.event.inputs.repost_run
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_probes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pillow
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kawach-ai-engine
          aws-region: ap-south-1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/834177061652/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-gemini@kavach-eval-1015.iam.gserviceaccount.com
          project_id: kavach-eval-1015
      - name: Build the world
        run: PYTHONPATH=. python -m eval.world.make && PYTHONPATH=. python -m eval.world.make --check
      - name: One Gemini call before any probe
        id: pre
        env:
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          NIGHTLY_OUT: runs/nightly
        run: PYTHONPATH=. python -m eval.live_routes --preflight
      - name: Probes (shard ${{ matrix.shard }} of 4)
        if: steps.pre.outputs.down != 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_probes
          DEBUG: "false"
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          LLM_PROVIDER: router
          NIGHTLY_OUT: runs/nightly
        run: |
          # each shard's own cap is its share of the night's (13 Oct: ₹600 over 4 shards = ₹150 each stopped 59 % of the probes;
          # the probes now print their cap and estimate, and a budget skip fails the night)
          export PROBES_MAX_INR=$(( MAX_INR / SHARDS ))
          PYTHONPATH=. python -u -m eval.world.probes $SLICE --shard ${{ matrix.shard }}/$SHARDS --parallel 2 --every $EVERY
      - name: Judge every reply (shard ${{ matrix.shard }}); no result is a failing night
        if: always() && steps.pre.outputs.down != 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_probes
          DEBUG: "false"
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          LLM_PROVIDER: router
          NIGHTLY_OUT: runs/nightly
        run: |
          export JUDGE_MAX_INR=$(( JUDGE_INR / SHARDS ))
          PYTHONPATH=. python -u -m eval.world.judge runs/nightly --sample 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-${{ matrix.shard }}
          path: runs/nightly
          retention-days: 90

  recall:
    # the story families' memory quiz, scored (C2) and their memory score (A2), on a rotation of 25 families a night
    needs: [probes]
    if: always() && github.event.inputs.fixture != 'true' && !github.event.inputs.repost_run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_recall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kawach-ai-engine
          aws-region: ap-south-1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/834177061652/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-gemini@kavach-eval-1015.iam.gserviceaccount.com
          project_id: kavach-eval-1015
      - name: Build the world
        run: PYTHONPATH=. python -m eval.world.make
      - name: One Gemini call before recall
        id: pre
        env:
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          NIGHTLY_OUT: runs/nightly
        run: PYTHONPATH=. python -m eval.live_routes --preflight
      - name: Recall (story families' quiz) and their memory score
        if: steps.pre.outputs.down != 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_recall
          DEBUG: "false"
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          LLM_PROVIDER: router
          NIGHTLY_OUT: runs/nightly
          RECALL_MAX_INR: ${{ env.RECALL_INR }}
        run: PYTHONPATH=. python -u -m eval.world.recall $SLICE --families 25 --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-recall
          path: runs/nightly
          retention-days: 90

  message-week:
    if: github.event.inputs.fixture != 'true' && !github.event.inputs.repost_run
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_budget
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: A simulated week of every proactive job, 200 families, no AI (plan B1.3 at full size)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_budget
          BUDGET_OUT: runs/budget
        run: PYTHONPATH=. python -u -m eval.world.budget --families 200 --days 7 --tick 5 | tee runs-budget.log
      - name: Regular nudges, two simulated days of five personas (no AI; Kavach NUdge's plan §5)
        if: always()
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_budget
          NUDGE_SIM_OUT: runs/nudge_day_sim
        run: PYTHONPATH=. python -u -m eval.nudge_day_sim --days 2 --tick 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: message-week
          path: |
            runs/budget
            runs-budget.log
            runs/nudge_day_sim
          retention-days: 90

  nudge-quality:
    needs: [recall]
    if: always() && github.event.inputs.fixture != 'true' && !github.event.inputs.repost_run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_nudgeq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kawach-ai-engine
          aws-region: ap-south-1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/834177061652/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-gemini@kavach-eval-1015.iam.gserviceaccount.com
          project_id: kavach-eval-1015
      - name: Build the world
        run: PYTHONPATH=. python -m eval.world.make
      - name: One Gemini call before the nudge eval
        id: pre
        env:
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          NIGHTLY_OUT: runs/nudge_quality
        run: PYTHONPATH=. python -m eval.live_routes --preflight
      - name: 300 regular nudges written by the live models and graded (10 per language; bar 90 %, no made-up facts, no advice)
        if: steps.pre.outputs.down != 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_nudgeq
          DEBUG: "false"
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          LLM_PROVIDER: router
          NUDGE_EVAL_MAX_INR: ${{ env.NUDGE_INR }}
        run: PYTHONPATH=. python -u -m eval.nudge_quality --per-language 10 --out runs/nudge_quality
      - name: The founder's points of 13 Oct with the live brain (restricted items, scope, health answers, relay, mood)
        if: steps.pre.outputs.down != 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_nudgeq
          DEBUG: "false"
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          LLM_PROVIDER: router
          POINTS_MAX_INR: "60"
          POINTS_OUT: runs/nudge_quality/founder_points.json
        run: PYTHONPATH=. python -u -m eval.founder_points_eval --repeat 2 | tee runs/nudge_quality/founder_points.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nudge-quality
          path: runs/nudge_quality
          retention-days: 90

  report:
    needs: [probes, recall, message-week, nudge-quality]
    if: always() && github.event.inputs.fixture != 'true' && !github.event.inputs.repost_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: probes-*
          path: tonight
      - name: The previous night's results (for new failures and fixes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow nightly-saheli.yml --status completed --limit 5 --json databaseId --jq '.[].databaseId' | grep -v "${{ github.run_id }}" | head -1 || true)
          if [ -n "$prev" ]; then gh run download "$prev" --pattern 'probes-*' --dir previous || true; fi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "{message-week,nudge-quality}"
          path: extras
      - name: Report and gate (scores.json; exit 1 when a release bar breaks)
        id: gate
        run: |
          set +e
          args="tonight --out report.md --scores scores.json --extras extras"
          [ -d previous ] && args="$args --previous previous"
          PYTHONPATH=. python -m eval.world.report $args
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          for f in extras/nudge-quality/report.md extras/message-week/runs/nudge_day_sim/report.md extras/message-week/nudge_day_sim/report.md; do
            [ -f "$f" ] && { echo; echo "---"; cat "$f"; } >> report.md
          done
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Email the night (the engine is on a private network, so the score cannot be posted from here)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          KIND: ${{ (github.event_name == 'schedule' || inputs.slice == 'full') && 'nightly' || 'fixture' }}
        run: |
          [ -f scores.json ] || echo '{"passed": false, "failures": ["the report wrote no scores.json"]}' > scores.json
          python3 scripts/post_eval_scores.py scores.json --kind "$KIND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            report.md
            scores.json
          retention-days: 90
      - name: Fail the night when a bar broke (no score is a failing score)
        if: always()
        run: |
          [ "${{ steps.gate.outputs.code }}" = "0" ] || { echo "::error::the nightly world score broke a release bar (see the summary)"; exit 1; }

  fixture:
    # one deliberate failing night: a stored scores.json (invented numbers) through the same gate; stored as kind "fixture",
    # so it never emails and never gates a deploy
    if: github.event.inputs.fixture == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: The fixture night through the gate
        id: gate
        run: |
          set +e
          cp tests/fixtures/world_scores_failing.json scores.json
          PYTHONPATH=. python -m eval.world.report --gate-only scores.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail on the broken bar
        run: |
          [ "${{ steps.gate.outputs.code }}" = "0" ] || { echo "::error::fixture night: a release bar is broken, as intended"; exit 1; }

  repost:
    # a night whose post was lost (the engine was between deploys): its scores.json posted again, as the night it was
    if: github.event.inputs.repost_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: That night's scores
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.inputs.repost_run }}
        run: |
          gh run download "$RUN" --name report --dir night
          info=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN" --jq '[.head_sha, .head_branch, .display_title, .created_at] | @tsv')
          sha=$(echo "$info" | cut -f1); branch=$(echo "$info" | cut -f2); title=$(echo "$info" | cut -f3); at=$(echo "$info" | cut -f4)
          kind=fixture; case "$title" in "Nightly full"*) case "$title" in *fixture*) ;; *) kind=nightly;; esac;; esac
          day=$(TZ=Asia/Kolkata date -d "$at" +%F)
          { echo "sha=$sha"; echo "branch=$branch"; echo "kind=$kind"; echo "day=$day"; } >> "$GITHUB_OUTPUT"
      - name: The engine is on a private network
        run: echo "::warning::GitHub cannot post scores to the engine (engine.kavach.local). The score stays in the report artifact; the night's email already went out."
