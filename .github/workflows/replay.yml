name: Replay cases (before every engine deploy)

# Trust plan C3: non-sensitive replay cases run on Gemini 3.5 Flash in kavach-eval-1015 (never kavach-care).
# A fixed case fails only if 2 of 3 runs fail. It blocks the deploy only when it is not on the Gemini model baseline.
# Sensitive cases stay paused. If kavach-eval-1015 refuses the preflight, the gate is UNAVAILABLE (exit 0) and does not
# fall through to Bedrock. OPEN cases run too and are reported. Called by deploy-aws.yml.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: run and report only (never posts results)"
        default: "true"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_replay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REPLAY_BUCKET: kavach-replay-cases-sunny
      GCP_PROJECT_ID: kavach-eval-1015
      GOOGLE_CLOUD_PROJECT: kavach-eval-1015
      GOOGLE_CLOUD_LOCATION: asia-south1
      SENSITIVE_EVALS: pause
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pillow
      - name: The repo's cases (the old export bucket is Vertex-side and is not required)
        run: |
          mkdir -p runs
          : > runs/cases.jsonl
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kawach-ai-engine
          aws-region: ap-south-1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/834177061652/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-gemini@kavach-eval-1015.iam.gserviceaccount.com
          project_id: kavach-eval-1015
      - name: One Gemini call before any case
        id: pre
        env:
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          NIGHTLY_OUT: runs/replay
        run: PYTHONPATH=. python -m eval.live_routes --preflight
      - name: Run every case (2 of 3; a new fixed failure blocks)
        id: run
        if: steps.pre.outputs.down != 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_replay
          DEBUG: "false"
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          LLM_PROVIDER: router
          REPLAY_MAX_INR: "200"
          REPLAY_DEADLINE_S: "900"
        run: |
          set +e
          PYTHONPATH=. python -u -m eval.replay_cases runs/cases.jsonl --parallel 2 --max-cases 60 --out runs/replay
          echo "code=$?" >> "$GITHUB_OUTPUT"
          [ -f runs/replay/summary.md ] && cat runs/replay/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Provider refused the preflight, so nothing was tested
        if: steps.pre.outputs.down == 'true'
        run: |
          echo "::warning::replay gate UNAVAILABLE: kavach-eval-1015 refused the preflight call. The deploy goes on if the tests passed."
          mkdir -p runs/replay
          python3 -c "import json,os; why=json.load(open('runs/replay/provider_down.json')).get('why','refused'); json.dump({'summary':{'unavailable':True,'why':why,'passed':False,'failures':['replay gate unavailable: '+why],'run_id':'replay-'+os.environ.get('GITHUB_RUN_ID','')}}, open('runs/replay/results.json','w'))"
          echo "# Replay cases before deploy: GATE UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
      - name: Email when the gate could not reach the model
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          p = Path("runs/replay/results.json")
          if not p.exists():
              raise SystemExit(0)
          summary = json.loads(p.read_text()).get("summary") or {}
          if not summary.get("unavailable"):
              raise SystemExit(0)
          import importlib.util
          spec = importlib.util.spec_from_file_location("post_eval_scores", "scripts/post_eval_scores.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          why = summary.get("why") or "the provider refused the preflight call"
          mod.email(
              "Replay gate UNAVAILABLE",
              "The pre-deploy replay gate could not reach the model.\n\n"
              f"Why: {why}\n\n"
              "No replay case got a real verdict, so this is not a failed case. "
              "The deploy goes on if the tests passed.\n",
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ github.run_id }}
          path: runs/replay
          retention-days: 30
      - name: Block when a fixed case failed (an old bug came back)
        if: always()
        run: |
          if [ "${{ steps.pre.outputs.down }}" = "true" ]; then
            echo "replay gate unavailable: deploy continues if the tests passed"
            exit 0
          fi
          [ "${{ steps.run.outputs.code }}" = "0" ] || { echo "::error::a fixed case that passes on the Gemini model baseline failed (2 of 3): the deploy is blocked (see the summary)"; exit 1; }
