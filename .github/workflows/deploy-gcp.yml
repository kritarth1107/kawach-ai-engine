name: Deploy AI engine to GCP Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-ai-engine-gcp
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: kavach-care
  GCP_REGION: asia-south1
  ARTIFACT_REPO: kavach
  SERVICE: kawach-ai-engine
  CLOUDSQL: kavach-care:asia-south1:kavach-ai-pg

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, push, and deploy
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE }}
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --image="$IMAGE:${{ github.sha }}" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --port=8000 \
            --memory=1Gi \
            --min-instances=0 \
            --max-instances=3 \
            --add-cloudsql-instances=${{ env.CLOUDSQL }} \
            --quiet

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.url)')"
          curl -fsS "$URL/health"
