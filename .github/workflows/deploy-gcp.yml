name: Deploy AI engine to GCP Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      override_nightly:
        description: "The founder only: deploy even though the latest nightly failed (trust plan D8)"
        default: "false"

concurrency:
  group: deploy-ai-engine-gcp
  # a running deploy finishes; GitHub keeps only the newest waiting one (so the latest commit still wins). With pushes every
  # few minutes and a 15-20 minute pipeline (tests, replay cases), cancelling in progress meant no deploy ever landed.
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: kavach-care
  GCP_REGION: asia-south1
  ARTIFACT_REPO: kavach
  SERVICE: kawach-ai-engine
  CLOUDSQL: kavach-care:asia-south1:kavach-ai-pg

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.17.0 pyright==1.1.414
      - name: Lint (real-bug rules, see pyproject)
        run: ruff check app eval tests
      - name: Types (errors may only go down; scripts/pyright_baseline.json)
        run: python scripts/pyright_gate.py

  nightly-gate:
    # founder decision D8: no engine deploy while the latest full nightly failed, except the fix ([fixes-nightly]) or the
    # founder's override (label nightly-override on its pull request, or override_nightly on a manual run by the founder)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Latest nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          OVERRIDE_NIGHTLY: ${{ github.event.inputs.override_nightly }}
        run: python3 scripts/nightly_gate.py

  replay:
    # trust plan C3: every fixed replay case on real Gemini (sunny-ship); one that fails 2 of 3 blocks the deploy
    needs: [test, lint]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/replay.yml
    secrets: inherit

  deploy:
    needs: [test, lint, nightly-gate, replay]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, push, and deploy
        env:
          KAWACH_PG_PASSWORD: ${{ secrets.KAWACH_PG_PASSWORD }}
          KAWACH_API_SECRET: ${{ secrets.KAWACH_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${KAWACH_PG_PASSWORD:-}" ] || [ -z "${KAWACH_API_SECRET:-}" ]; then
            echo "::error::Missing KAWACH_PG_PASSWORD or KAWACH_API_SECRET repo secrets"
            exit 1
          fi
          DATABASE_URL="postgresql+asyncpg://kawach:${KAWACH_PG_PASSWORD}@/kawach_ai?host=/cloudsql/${{ env.CLOUDSQL }}"
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE }}
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          cat > /tmp/ai-engine-env.yaml <<EOF
          LLM_PROVIDER: vertex
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GCP_REGION: ${{ env.GCP_REGION }}
          VERTEX_LOCATION: global
          VERTEX_CHAT_MODEL: gemini-3.1-pro-preview
          VERTEX_CAREGIVER_CHAT_MODEL: gemini-3.1-pro-preview
          # Brain v2 model order per role: India region first (2-3 s turns, data stays in India).
          # Gemini only for every role (no Claude Model Garden quota); defaults would try Claude first.
          MODEL_ROUTES: '{"brain": ["gemini:gemini-3.5-flash@asia-south1"], "extract": ["gemini:gemini-3.5-flash@asia-south1"], "worker": ["gemini:gemini-3.5-flash@asia-south1"], "classify": ["gemini:gemini-3.5-flash@asia-south1"], "judge": ["gemini:gemini-3.5-flash@asia-south1"], "judge_fast": ["gemini:gemini-3.5-flash@asia-south1"], "learn": ["gemini:gemini-3.5-flash@asia-south1"], "vision": ["gemini:gemini-3.5-flash@asia-south1"], "speech": ["gemini:gemini-3.5-flash@asia-south1"]}'
          VERTEX_EMBEDDING_MODEL: text-multilingual-embedding-002
          EMBED_DIM: "768"
          DEBUG: "false"
          CORS_ORIGINS: "*"
          DATABASE_URL: "${DATABASE_URL}"
          KAWACH_API_SECRET: "${KAWACH_API_SECRET:-}"
          KAVACH_BACKEND_URL: "https://kavach-backend-303943038694.asia-south1.run.app"
          MEMORY_GCS_BUCKET: "${MEMORY_GCS_BUCKET:-kavach-memory-exports}"
          KAVACH_JOB_SECRET: "${HEALTH_SECRET:-}"
          # /v2/admin: only the admin API's own identity, with its own secret (ENGINE_ADMIN_SECRET below)
          ADMIN_API_SA: kavach-admin-api@kavach-care.iam.gserviceaccount.com
          ENGINE_AUDIENCES: "https://kawach-ai-engine-303943038694.asia-south1.run.app,https://kawach-ai-engine-bcvowb5kfq-el.a.run.app"
          # /v2/admin/eval-scores and /replay-results: the nightly and the replay job post as the GitHub deploy identity (trust plan C2, C3)
          EVAL_POSTER_SA: github-deploy@kavach-care.iam.gserviceaccount.com
          ADMIN_CONSOLE_URL: https://kavach-admin-bcvowb5kfq-el.a.run.app
          REPLAY_EXPORT_BUCKET: kavach-replay-cases-sunny
          # Practice orders (app/tasks/practice.py): families whose orders stop at the store's last step. Set and cleared with
          # the repo variable PRACTICE_ORDER_FAMILIES, so every deploy keeps it (an env set by hand would be wiped here).
          PRACTICE_ORDER_FAMILIES: "${{ vars.PRACTICE_ORDER_FAMILIES }}"
          # Testing: families whose orders skip the store connectors (app/specialists/channels.py browser_only).
          BROWSER_ONLY_FAMILIES: "${{ vars.BROWSER_ONLY_FAMILIES }}"
          EOF
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --image="$IMAGE:${{ github.sha }}" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --port=8000 \
            --memory=1Gi \
            --min-instances=1 \
            --max-instances=3 \
            --add-cloudsql-instances=${{ env.CLOUDSQL }} \
            --env-vars-file=/tmp/ai-engine-env.yaml \
            --update-secrets=BROWSER_USE_API_KEY=backend-browser-use-api-key:latest,ENGINE_ADMIN_SECRET=engine-admin-secret:latest \
            --quiet

      - name: Grant backend service account invoker access
        run: |
          BACKEND_SA="$(gcloud run services describe kavach-backend \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)"
          if [ -z "$BACKEND_SA" ] || [ "$BACKEND_SA" = "null" ]; then
            BACKEND_SA="303943038694-compute@developer.gserviceaccount.com"
          fi
          gcloud run services add-iam-policy-binding ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:${BACKEND_SA}" \
            --role="roles/run.invoker" \
            --quiet
          # the admin API reaches only /v2/admin (its own secret + identity check in app/api/admin.py)
          gcloud run services add-iam-policy-binding ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:kavach-admin-api@kavach-care.iam.gserviceaccount.com" \
            --role="roles/run.invoker" --quiet

      - name: Verify revision ready
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.conditions[0].status)' | grep -qx True
