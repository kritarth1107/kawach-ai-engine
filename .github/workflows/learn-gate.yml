name: Learn gate (a waiting playbook draft through the replay cases)

# Trust plan §10.2 step 2: the 02:00 night makes a playbook draft but cannot run the replay cases, so the draft waits.
# When it runs, it calls Gemini in kavach-eval-1015, never kavach-care. GitHub cannot reach the engine (engine.kavach.local), so it
# does not run cases and does not post: the draft keeps waiting. Leave this workflow disabled until that path exists.

on:
  schedule:
    - cron: "0 22 * * *"   # 03:30 IST, after the 02:00 dream
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: run and print only (never posts the result)"
        default: "false"

concurrency:
  group: learn-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The engine is private, so this job does not call a model
        run: |
          echo "::warning::Learn gate stays idle. It would call Gemini in kavach-eval-1015, never kavach-care, but GitHub cannot reach engine.kavach.local, so no case runs and nothing is posted. The draft keeps waiting."
          echo "# Learn gate idle" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub cannot reach the engine. No Vertex call, no Bedrock call." >> "$GITHUB_STEP_SUMMARY"
