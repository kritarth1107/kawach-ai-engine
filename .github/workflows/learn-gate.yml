name: Learn gate (retired: it runs in AWS)

# GitHub cannot reach the engine, and it will not. The draft gate is the kavach-learn-gate task at 03:30 IST
# (kavach-infra-aws images/cron/crontab), capped at ₹30, same pass rules. This workflow is not scheduled.
# A deploy replay stays in replay.yml.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: run and print only (never posts the result)"
        default: "false"

concurrency:
  group: learn-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kawach_replay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GCP_PROJECT_ID: kavach-eval-1015
      GOOGLE_CLOUD_PROJECT: kavach-eval-1015
      GOOGLE_CLOUD_LOCATION: asia-south1
      SENSITIVE_EVALS: pause
      LEARN_REPLAY_MAX_INR: "30"
    steps:
      - uses: actions/checkout@v4
      - name: The engine is on a private network
        id: reach
        run: |
          if getent hosts engine.kavach.local >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "ENGINE_URL=http://engine.kavach.local" >> "$GITHUB_ENV"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Learn gate spends nothing. GitHub cannot reach engine.kavach.local, so it cannot read the draft or post a canary. The draft keeps waiting."
            echo "# Learn gate idle" >> "$GITHUB_STEP_SUMMARY"
            echo "No Vertex call. The draft keeps waiting until this job can reach the engine." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.reach.outputs.ok == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pillow
        if: steps.reach.outputs.ok == 'true'
      - uses: google-github-actions/auth@v2
        if: steps.reach.outputs.ok == 'true'
        with:
          workload_identity_provider: projects/834177061652/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-gemini@kavach-eval-1015.iam.gserviceaccount.com
          project_id: kavach-eval-1015
      - name: Draft cases, capped at ₹30
        if: steps.reach.outputs.ok == 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_replay
          REPLAY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kawach_replay
          WEB_SEARCH_PROVIDER: "off"
          MEMORY_EMBEDDINGS: "off"
          LLM_PROVIDER: router
        run: |
          args=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then args="--dry-run"; fi
          PYTHONPATH=. python -u -m eval.learn_gate $args
