name: Deploy memory dream job

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "app/jobs/dream.py"
      - "app/jobs/memory_context.py"
      - "app/rag/**"
      - "app/models/entities.py"
      - "Dockerfile"
      - ".github/workflows/deploy-memory-dream.yml"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-south1
  JOB_NAME: kawach-memory-dream
  IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kavach/kawach-ai-engine

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy Cloud Run Job
        run: |
          cat > /tmp/dream-job-env.yaml <<EOF
          LLM_PROVIDER: vertex
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GCP_REGION: ${{ env.GCP_REGION }}
          VERTEX_CHAT_MODEL: gemini-2.5-flash-lite
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          KAWACH_API_SECRET: "${{ secrets.KAWACH_API_SECRET }}"
          KAVACH_BACKEND_URL: "https://kavach-backend-303943038694.asia-south1.run.app"
          KAVACH_JOB_SECRET: "${{ secrets.HEALTH_SECRET }}"
          MEMORY_GCS_BUCKET: "${{ secrets.MEMORY_GCS_BUCKET }}"
          EOF
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --image="$IMAGE:${{ github.sha }}" \
            --command=python \
            --args=-m,app.jobs.dream,--all \
            --memory=1Gi \
            --max-retries=1 \
            --task-timeout=3600 \
            --env-vars-file=/tmp/dream-job-env.yaml \
            --quiet || \
          gcloud run jobs create ${{ env.JOB_NAME }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --image="$IMAGE:${{ github.sha }}" \
            --command=python \
            --args=-m,app.jobs.dream,--all \
            --memory=1Gi \
            --max-retries=1 \
            --task-timeout=3600 \
            --env-vars-file=/tmp/dream-job-env.yaml \
            --quiet

      - name: Ensure nightly scheduler (02:00 IST)
        run: |
          gcloud scheduler jobs describe kawach-memory-dream-nightly \
            --project=${{ env.GCP_PROJECT_ID }} \
            --location=${{ env.GCP_REGION }} 2>/dev/null || \
          gcloud scheduler jobs create http kawach-memory-dream-nightly \
            --project=${{ env.GCP_PROJECT_ID }} \
            --location=${{ env.GCP_REGION }} \
            --schedule="0 2 * * *" \
            --time-zone="Asia/Kolkata" \
            --uri="https://${{ env.GCP_REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.GCP_PROJECT_ID }}/jobs/${{ env.JOB_NAME }}:run" \
            --http-method=POST \
            --oauth-service-account-email="${{ secrets.GCP_SA_EMAIL }}" \
            --quiet
