[project]
name = "kawach-ai-engine"
version = "0.1.0"
description = "Kavach AI engine — Grok, RAG, LangGraph Saheli"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "langgraph>=0.2.60",
  "langchain>=0.3.14",
  "langchain-xai>=1.3.0",
  "langchain-openai>=0.3.0",
  "langchain-community>=0.3.14",
  "langchain-text-splitters>=0.3.4",
  "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# CI gate: real-bug rules only (syntax, undefined/unused names, bugbear, async).
select = ["E9", "F", "B", "ASYNC"]
# FastAPI Depends() defaults, zip strictness, unused loop vars, raise-from and blocking file reads in
# short admin/eval paths are accepted style here; context-var defaults are read-only by convention.
ignore = ["B007", "B008", "B904", "B905", "B039", "ASYNC109", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# Ordering code and its tests belong to Order Engineer; these findings are passed on, not silently edited.
"app/tasks/**" = ["F841", "B023"]
"eval/order_*.py" = ["F401", "F841"]
"tests/test_tasks.py" = ["F821", "F841"]
"tests/test_order_*.py" = ["F401", "F841"]
"tests/test_browser_use.py" = ["F401", "F841"]
"tests/{test_later,test_no_book_before_confirm,test_ride_pins,test_for_whom}.py" = ["F401"]

[tool.pyright]
# Production runs Python 3.11 (Dockerfile); CI gates on scripts/pyright_gate.py (errors may only go down).
pythonVersion = "3.11"
include = ["app"]
