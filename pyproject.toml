[project]
name = "kawach-ai-engine"
version = "0.1.0"
description = "Kavach AI engine — Grok, RAG, LangGraph Saheli"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "langgraph>=0.2.60",
  "langchain>=0.3.14",
  "langchain-xai>=1.3.0",
  "langchain-openai>=0.3.0",
  "langchain-community>=0.3.14",
  "langchain-text-splitters>=0.3.4",
  "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
